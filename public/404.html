<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOTTUS</title>
</head>
<body>
  <script>
    // GitHub Pages no soporta rewrites del servidor: para las URLs "bonitas"
    // (/catalogo, /sora, /contacto, /admin, /producto/:slug, /asesor/:slug)
    // GH Pages devuelve este 404.html manteniendo la URL original en la barra.
    // Aquí cargamos el HTML real correspondiente sin navegar, así la URL no cambia
    // y el JS de cada página (que lee el slug desde location.pathname) sigue funcionando.
    (function () {
      var path = location.pathname;
      var target = null;

      if (path.indexOf('/producto/') === 0) target = '/producto.html';
      else if (path === '/asesor' || path === '/asesor/' || path.indexOf('/asesor/') === 0 || path === '/asesores' || path === '/asesores/') target = '/asesor.html';
      else if (path === '/catalogo' || path === '/catalogo/') target = '/catalogo.html';
      else if (path === '/sora' || path === '/sora/') target = '/sora.html';
      else if (path === '/contacto' || path === '/contacto/') target = '/contacto.html';
      else if (path === '/admin' || path === '/admin/') target = '/admin.html';

      if (!target) {
        document.body.innerHTML = '<div style="font-family:sans-serif;text-align:center;padding:80px 20px"><h1>404 — Página no encontrada</h1><p><a href="/">Volver al inicio</a></p></div>';
        return;
      }

      fetch(target)
        .then(function (r) { return r.text(); })
        .then(function (html) {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          location.replace(target);
        });
    })();
  </script>
</body>
</html>
